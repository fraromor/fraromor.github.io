# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: "blue"  # Default option

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'Weierstrass Institute'
    description: 'Francesco Romor, researcher in computational modeling'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: 'lj0mHQDM34qk-49kFjRjp-Qd1XEJ1cuQP5yCE-xHjNs'
    baidu: ''
  logo:
    text: "FR"  # Replace the "H" with your initials
    image: "media/logo.svg"  # Optional — if using an image logo

# Site header
header:
  navbar:
    enable: true
    blox: "navbar"
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      text: "Francesco Romor"

# Site footer
footer:
  copyright:
    notice: '© {year} Francesco Romor. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: true
  privacy_pack:
    enable: false
